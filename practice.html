<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمارين Tailwind</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="font-cairo bg-gray-50 text-gray-800">

  <nav class="bg-white shadow">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <span class="font-bold text-brand">اللوجو</span>
      <ul class="hidden md:flex gap-6 text-sm">
        <li><a href="#" class="hover:text-brand">الرئيسية</a></li>
        <li><a href="#" class="hover:text-brand">من نحن</a></li>
        <li><a href="#" class="hover:text-brand">اللجان</a></li>
      </ul>
      <button class="md:hidden text-2xl" aria-label="القائمة">☰</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-10 space-y-10">

    <section>
      <h2 class="text-xl font-bold mb-4">Button</h2>
      <button class="px-5 py-2 rounded-md bg-brand text-white font-semibold transition
                     hover:bg-brand-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">
        زرار أساسي
      </button>
      <button class="px-5 py-2 rounded-md border border-brand text-brand font-semibold transition hover:bg-brand hover:text-white">
        زرار ثانوي
      </button>
    </section>

    <!-- تمرين 3 و 4: Card جوه Grid متجاوب -->
    <section>
      <h2 class="text-xl font-bold mb-4">Card + Grid</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <article class="bg-white rounded-lg shadow-md p-5 transition hover:-translate-y-1 hover:shadow-xl">
          <h3 class="font-bold text-lg mb-2">كارت 1</h3>
          <p class="text-sm text-gray-500 mb-4">عمود واحد في الموبايل، 2 في التابلت، 3 في الديسكتوب.</p>
          <a href="#" class="text-brand text-sm font-semibold hover:underline">اقرأ المزيد</a>
        </article>
        <article class="bg-white rounded-lg shadow-md p-5 transition hover:-translate-y-1 hover:shadow-xl">
          <h3 class="font-bold text-lg mb-2">كارت 2</h3>
          <p class="text-sm text-gray-500 mb-4">shadow-md عادي و hover:shadow-xl لما الماوس يقف عليه.</p>
          <a href="#" class="text-brand text-sm font-semibold hover:underline">اقرأ المزيد</a>
        </article>
        <article class="bg-white rounded-lg shadow-md p-5 transition hover:-translate-y-1 hover:shadow-xl">
          <h3 class="font-bold text-lg mb-2">كارت 3</h3>
          <p class="text-sm text-gray-500 mb-4">gap-6 بيعمل مسافة بين الكروت من غير margin.</p>
          <a href="#" class="text-brand text-sm font-semibold hover:underline">اقرأ المزيد</a>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
